<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220"><rect width="1100" height="220" rx="18" fill="#101827"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="35" font-size="19" font-weight="bold" fill="#eff6ff">From raw face pixels to compact identification</text><g font-size="15" fill="#e2e8f0"><rect x="35" y="78" width="185" height="90" rx="12" fill="#1e3a52" stroke="#62b6cb"/><text x="127" y="112">62 × 47 grayscale</text><text x="127" y="139" fill="#86dce9">2,914 features</text><rect x="295" y="78" width="200" height="90" rx="12" fill="#233552" stroke="#84aaff"/><text x="395" y="108">Per-image z-score</text><text x="395" y="136" fill="#a5b4fc">Train-only fitting</text><rect x="575" y="78" width="215" height="90" rx="12" fill="#173e44" stroke="#67d8ba"/><text x="682" y="109">PCA / SPCA</text><text x="682" y="138" fill="#a7f3d0">Optional LDA</text><rect x="865" y="78" width="200" height="90" rx="12" fill="#483347" stroke="#f0a6cf"/><text x="965" y="110">Mahalanobis</text><text x="965" y="139" fill="#f9c5df">or 1-NN</text></g><g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"><path d="M230 123h49m-9 -7 9 7-9 7"/><path d="M505 123h54m-9 -7 9 7-9 7"/><path d="M800 123h49m-9 -7 9 7-9 7"/></g><text x="550" y="202" fill="#94a3b8" font-size="13">Offline evaluation: 10 stratified 50/50 splits · Edge deployment: analytical resource estimates, not hardware timings</text></g></svg>